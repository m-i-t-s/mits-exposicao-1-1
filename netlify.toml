[build]
  publish = "public"
  functions = "netlify/function"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Obriga o navegador a verificar os SVGs atualizados, pois os nomes não mudam.
[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
